plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.erpium'
version = '0.0.1-SNAPSHOT'
description = 'ERP backend'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// Web starter (optional, if building web/REST APIs)
    implementation 'org.springframework.boot:spring-boot-starter-web'
	// Spring Data JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    
    // PostgreSQL Driver
    runtimeOnly 'org.postgresql:postgresql'
    
    // MapStruct for compile-time DTO mapping with Java 21 records
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    testAnnotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('jar') {
	enabled = false
}

tasks.register('installGitHooks') {
	description = 'Configures Git core.hooksPath to .githooks and ensures executable permissions'
	group = 'verification'

	doLast {
		File rootDir = rootProject.projectDir.parentFile ?: rootProject.projectDir
		File gitDir = new File(rootDir, '.git')
		File hooksDir = new File(rootDir, '.githooks')

		if (gitDir.exists() && hooksDir.exists()) {
			try {
				new ProcessBuilder('git', 'config', 'core.hooksPath', '.githooks')
					.directory(rootDir)
					.start()
					.waitFor()

				if (!System.getProperty('os.name').toLowerCase().contains('windows')) {
					def hookFiles = hooksDir.listFiles()?.collect { it.absolutePath } ?: []
					if (!hookFiles.isEmpty()) {
						def chmodCmd = ['chmod', '+x'] + hookFiles
						new ProcessBuilder(chmodCmd)
							.directory(rootDir)
							.start()
							.waitFor()
					}
				}
				logger.lifecycle("✅ Git hooks configured successfully: core.hooksPath = .githooks")
			} catch (Exception e) {
				logger.warn("⚠️ Failed to configure Git hooks: " + e.message)
			}
		} else {
			logger.lifecycle("ℹ️ Skipping Git hooks setup: .git or .githooks directory not found at ${rootDir}")
		}
	}
}

tasks.named('compileJava') {
	dependsOn 'installGitHooks'
}
